<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vid2scene — Mip-NeRF 360 room splat</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 10px; left: 12px; color: #ccc; font-size: 13px;
         background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px; z-index: 10; }
</style>
</head>
<body>
<div id="hud">vid2scene · Mip-NeRF 360 "room" · Gaussian splat (1.09M) · drag to orbit · scroll to zoom</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
}}
</script>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const viewer = new GaussianSplats3D.Viewer({
  'sharedMemoryForWorkers': false,
  'cameraUp': [0, -1, 0],
  'initialCameraPosition': [3.5, -3.0, 4.5],
  'initialCameraLookAt': [0.474, -0.489, 1.513],
  'sphericalHarmonicsDegree': 0,
});

viewer.addSplatScene('../runs/mip360_room/splat_hires.ply', {
  'format': GaussianSplats3D.SceneFormat.Ply,
  'showLoadingUI': true,
  'progressiveLoad': false,
}).then(() => viewer.start())
  .catch((e) => { document.getElementById('hud').textContent = 'load error: ' + e; console.error(e); });
</script>
</body>
</html>
