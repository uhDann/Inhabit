<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vid2scene — room point cloud</title>
<style>
  html, body { margin: 0; height: 100%; background: #101012; overflow: hidden;
               font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 10px; left: 12px; color: #c8c8c8; font-size: 13px;
         background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px; }
  #hud input { vertical-align: middle; }
  #err { position: fixed; top: 50%; left: 0; right: 0; text-align: center; color: #e66; }
</style>
</head>
<body>
<div id="hud">
  vid2scene · pose-assisted reconstruction · drag to orbit · scroll to zoom ·
  point size <input id="sz" type="range" min="0.002" max="0.05" step="0.002" value="0.012" />
</div>
<div id="err"></div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

const PLY = '../runs/room0_ingest/recon_pose_assisted.ply';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101012);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;
function render() { renderer.render(scene, camera); }
controls.addEventListener('change', render);

const mat = new THREE.PointsMaterial({ size: 0.012, vertexColors: true, sizeAttenuation: true });

new PLYLoader().load(PLY, (geo) => {
  geo.computeBoundingBox();
  const center = new THREE.Vector3();
  geo.boundingBox.getCenter(center);
  const size = new THREE.Vector3();
  geo.boundingBox.getSize(size);

  const points = new THREE.Points(geo, mat);
  points.scale.y = -1;            // OpenCV world is Y-down; flip so the room is upright
  scene.add(points);

  const target = center.clone().multiply(new THREE.Vector3(1, -1, 1));
  controls.target.copy(target);
  camera.position.copy(target).add(new THREE.Vector3(size.x * 0.6, -size.y * 0.4, size.length()));
  controls.update();
  render();
}, undefined, (e) => {
  document.getElementById('err').textContent = 'Failed to load ' + PLY + ' — is the http server running from the vid2scene/ root?';
  console.error(e);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  render();
});
document.getElementById('sz').oninput = (e) => { mat.size = parseFloat(e.target.value); render(); };
</script>
</body>
</html>
